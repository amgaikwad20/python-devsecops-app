name: Python DevSecOps CI

on:
  push:
    branches:
      - main

jobs:

  build-test-scan-push:

    runs-on: self-hosted

    steps:

      # 1. Checkout
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # 4. Run tests
      - name: Run tests
        run: |
          pytest

      # 5. SonarQube
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ vars.DOCKERHUB_USERNAME }}/python-devsecops-app:${{ github.run_number }} \
            -t ${{ vars.DOCKERHUB_USERNAME }}/python-devsecops-app:latest \
            .

      # 7. Trivy vulnerability scan
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/python-devsecops-app:${{ github.run_number }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 8. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Push versioned image
      - name: Push versioned image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/python-devsecops-app:${{ github.run_number }}

      # 10. Push latest image
      - name: Push latest image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/python-devsecops-app:latest

