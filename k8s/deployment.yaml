apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-devsecops-app
  namespace: python-devsecops
  labels:
    app: python-devsecops-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-devsecops-app

  template:
    metadata:
      labels:
        app: python-devsecops-app

    spec:
      containers:
        - name: python-devsecops-app
          image: amol20/python-devsecops-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
